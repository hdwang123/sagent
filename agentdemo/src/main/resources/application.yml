spring:
  application:
    name: agentdemo
  datasource:
    url: jdbc:h2:mem:sagent;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: classpath:/embedding/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: classpath:/embedding/all-MiniLM-L6-v2/tokenizer.json
    openai:
#      base-url: https://openrouter.ai/api/v1
#      api-key: ${OPENROUTER_API_KEY:not-configured}
#      chat:
#        base-url: https://openrouter.ai/api/v1
#        options:
#          model: ${OPENROUTER_MODEL:openrouter/free}
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        base-url: https://api.deepseek.com/v1
        options:
          model: deepseek-v4-flash
mcp:
  server:
    url: http://localhost:8081/mcp

agent:
  multi:
    sub-agent-timeout-seconds: 60
    max-retry: 1
    max-replan: 2
    thread-pool-size: 4
  document-skill:
    max-read-chars: 8000
  chat-memory:
    max-messages: 20
    max-tool-messages: 4
  rag:
    max-results: 3
    similarity-threshold: 0.1
    hybrid-top-k: 10
    reranked-top-k: 3
    retrieval-history-windows: 2
  cost:
    pricing:
      # 模型 token 定价（人民币 / 每 1000 tokens，DeepSeek 高峰时段价）
      # 来源：DeepSeek 官方定价 api-docs.deepseek.com（2026-08-17 起启用峰谷分时：
      #   高峰 9-12 / 14-18 工作日，空闲为其余时间，空闲价 = 高峰 × 50%）
      # 输入 token 分缓存命中（cache-read）与未命中两档计费，命中价远低于未命中
      # 注意：本配置采用高峰档单价统一计费，空闲时段会高估约 100%，不引入运行时时段判断
      default-model: deepseek-v4-flash
      models:
        deepseek-v4-flash:
          input-price-per-1k: 0.003
          output-price-per-1k: 0.009
          cache-read-input-price-per-1k: 0.0001
        deepseek-v4-pro:
          input-price-per-1k: 0.009
          output-price-per-1k: 0.027
          cache-read-input-price-per-1k: 0.0003

app:
  playwright:
    preheat: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org:
      springframework:
        ai: DEBUG
        chat:
          client:
            advisor: DEBUG
