spring:
  application:
    name: agentdemo
  datasource:
    url: jdbc:h2:mem:sagent;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: classpath:/embedding/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: classpath:/embedding/all-MiniLM-L6-v2/tokenizer.json
    openai:
#      base-url: https://openrouter.ai/api/v1
#      api-key: ${OPENROUTER_API_KEY:not-configured}
#      chat:
#        base-url: https://openrouter.ai/api/v1
#        options:
#          model: ${OPENROUTER_MODEL:openrouter/free}
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        base-url: https://api.deepseek.com/v1
        options:
          model: deepseek-chat
mcp:
  server:
    url: http://localhost:8081/mcp

agent:
  multi:
    sub-agent-timeout-seconds: 60
    max-retry: 1
    max-replan: 2
    thread-pool-size: 4
  document-skill:
    max-read-chars: 8000
  chat-memory:
    max-messages: 20
    max-tool-messages: 4
  rag:
    max-results: 3
    similarity-threshold: 0.1
    hybrid-top-k: 10
    reranked-top-k: 3
    retrieval-history-windows: 2
  cost:
    pricing:
      # 模型 token 定价（人民币 / 每 1000 tokens，平时价）
      # 来源：DeepSeek 官方定价 api-docs.deepseek.com（2026-08，高峰时段价格为平时 2 倍）
      default-model: deepseek-v4-flash
      models:
        deepseek-v4-flash:
          input-price-per-1k: 0.001
          output-price-per-1k: 0.002
        deepseek-v4-pro:
          input-price-per-1k: 0.003
          output-price-per-1k: 0.006
        # deepseek-chat 旧别名已映射至 deepseek-v4-flash 定价
        deepseek-chat:
          input-price-per-1k: 0.001
          output-price-per-1k: 0.002

app:
  playwright:
    preheat: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org:
      springframework:
        ai: DEBUG
        chat:
          client:
            advisor: DEBUG
