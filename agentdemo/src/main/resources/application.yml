spring:
  application:
    name: agentdemo
  datasource:
    url: jdbc:h2:mem:sagent;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: classpath:/embedding/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: classpath:/embedding/all-MiniLM-L6-v2/tokenizer.json
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:not-configured}
      chat:
        base-url: https://openrouter.ai/api/v1
        options:
          model: ${OPENROUTER_MODEL:openrouter/free}
#      base-url: https://api.deepseek.com/v1
#      api-key: ${DEEPSEEK_API_KEY:not-configured}
#      chat:
#        base-url: https://api.deepseek.com/v1
#        options:
#          model: deepseek-chat
mcp:
  server:
    url: http://localhost:8081/mcp

agent:
  multi:
    sub-agent-timeout-seconds: 60
    max-retry: 1
    max-replan: 2
    thread-pool-size: 4
  document-skill:
    max-read-chars: 8000
  chat-memory:
    max-messages: 20
    max-tool-messages: 4
  rag:
    max-results: 3
    similarity-threshold: 0.1
    hybrid-top-k: 10
    reranked-top-k: 3
    retrieval-history-windows: 2

logging:
  level:
    org:
      springframework:
        ai: DEBUG
        chat:
          client:
            advisor: DEBUG
